<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SQL Training - Normal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sql-training">
    <h1>SQL Training <span>(Normal)</span></h1>

    <div class="sql-question-layout">
        <div class="mission-box">
            <div style="color:var(--accent-yellow); font-weight:bold;">MISSION:</div>
            <p id="mission">読み込み中...</p>
        </div>
        <div class="sql-table-panel">
            <h2>サンプルデータ</h2>
            <div id="sample-tables"></div>
        </div>
    </div>

    <div class="result-hint">
        <button id="result-toggle" class="btn-base control-btn" type="button" onclick="toggleResult()">実行結果(ヒント): OFF</button>
        <div id="result-table" class="sql-table-panel result-table-container" hidden></div>
    </div>

    <div class="drop-zone" id="drop-zone"></div>
    <div id="chip-pool" class="controls-row"></div>

    <div class="controls-row">
        <button class="btn-base start-btn" style="margin:0" onclick="check()">RUN SQL</button>
        <button class="btn-base control-btn" onclick="showAnswer()">解答を表示</button>
        <button class="btn-base control-btn" onclick="undo()">UNDO</button>
    </div>

    <div id="answer-panel" class="sql-table-panel" hidden>
        <h2>模範解答</h2>
        <pre id="model-answer"></pre>
        <button class="btn-base start-btn" style="margin:0" onclick="nextProblem()">次の問題へ</button>
    </div>

    <div id="mark" class="judgment-mark">⭕️</div>

    <a href="index.html" class="back-link">← Portalに戻る</a>

    <script>
        const questions = [
            {
                q: "usersからageが20以上の人を全て取得せよ",
                ans: ["SELECT", "*", "FROM", "users", "WHERE", "age", ">=", "20"],
                tables: [{ name: "users", columns: ["id", "name", "age"], rows: [[1, "Alice", 22], [2, "Bob", 19], [3, "Carol", 25]] }],
                result: { columns: ["id", "name", "age"], rows: [[1, "Alice", 22], [3, "Carol", 25]] }
            },
            {
                q: "productsからpriceが高い順に取得せよ",
                ans: ["SELECT", "*", "FROM", "products", "ORDER BY", "price", "DESC"],
                tables: [{ name: "products", columns: ["id", "name", "price"], rows: [[1, "PC", 120000], [2, "Mouse", 3000], [3, "Keyboard", 8000]] }],
                result: { columns: ["id", "name", "price"], rows: [[1, "PC", 120000], [3, "Keyboard", 8000], [2, "Mouse", 3000]] }
            },
            {
                q: "itemsからnameが 'PC' のものを取得せよ",
                ans: ["SELECT", "*", "FROM", "items", "WHERE", "name", "=", "'PC'"],
                tables: [{ name: "items", columns: ["id", "name", "category"], rows: [[1, "PC", "device"], [2, "Desk", "furniture"], [3, "PC", "device"]] }],
                result: { columns: ["id", "name", "category"], rows: [[1, "PC", "device"], [3, "PC", "device"]] }
            }
        ];
        let current = 0, userAns = [];

        function tableMarkup(table) {
            const title = table.name ? `<h2>${table.name}</h2>` : '';
            return `${title}<table class="sql-table"><thead><tr>${table.columns.map(column => `<th>${column}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row => `<tr>${row.map(value => `<td>${value}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        }

        function renderTables() {
            const question = questions[current];
            document.getElementById('sample-tables').innerHTML = question.tables.map(tableMarkup).join('');
            document.getElementById('result-table').innerHTML = `<h2>実行結果</h2>${tableMarkup({ name: "", ...question.result })}`;
        }

        function toggleResult() {
            const result = document.getElementById('result-table');
            const toggle = document.getElementById('result-toggle');
            result.hidden = !result.hidden;
            toggle.innerText = `実行結果(ヒント): ${result.hidden ? 'OFF' : 'ON'}`;
        }

        function next() {
            if(current >= questions.length) { alert("Excellent!"); return location.reload(); }
            userAns = [];
            document.getElementById('mission').innerText = questions[current].q;
            renderTables();
            document.getElementById('result-table').hidden = true;
            document.getElementById('result-toggle').innerText = '実行結果(ヒント): OFF';
            document.getElementById('answer-panel').hidden = true;
            const pool = document.getElementById('chip-pool');
            pool.innerHTML = '';
            const chips = [...questions[current].ans, "GROUP BY", "id", "ASC", "LIMIT"].sort(() => Math.random() - 0.5);
            chips.forEach(text => {
                const div = document.createElement('div');
                div.className = 'sql-chip'; div.innerText = text;
                div.onclick = () => { userAns.push(text); updateUI(); };
                pool.appendChild(div);
            });
            updateUI();
        }

        function updateUI() {
            const zone = document.getElementById('drop-zone');
            zone.innerHTML = '';
            userAns.forEach(text => {
                const div = document.createElement('div');
                div.className = 'sql-chip'; div.innerText = text;
                zone.appendChild(div);
            });
        }

        function undo() { userAns.pop(); updateUI(); }

        function showAnswer() {
            document.getElementById('model-answer').textContent = questions[current].ans.join(' ');
            document.getElementById('answer-panel').hidden = false;
        }

        function nextProblem() {
            current++;
            next();
        }

        function check() {
            const win = userAns.join(' ') === questions[current].ans.join(' ');
            const m = document.getElementById('mark');
            m.innerText = win ? '⭕️' : '❌';
            m.className = `judgment-mark show-mark ${win ? 'mark-o' : 'mark-x'}`;
            if(win) { current++; setTimeout(() => { m.className='judgment-mark'; next(); }, 1200); }
            else { setTimeout(() => m.className='judgment-mark', 800); }
        }
        window.onload = next;
    </script>
</body>
</html>
