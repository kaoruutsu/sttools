<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Address Type Attack</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../style.css">
    <style>
        .speed-select { margin-bottom: 20px; }
        .speed-btns { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .speed-btn {
            flex: 1;
            padding: 8px 15px;
            color: #fff;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-blue);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .speed-btn.active { color: #000; background: var(--accent-blue); font-weight: bold; }
        .ip-target {
            position: absolute;
            top: -50px;
            width: 100%;
            color: var(--accent-yellow);
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: bold;
            font-family: monospace;
            text-align: center;
            white-space: nowrap;
        }
        .correct-answer {
            position: absolute;
            top: 68%;
            left: 50%;
            z-index: 201;
            color: var(--accent-cyan);
            font-size: 1.3rem;
            font-weight: bold;
            opacity: 0;
            transform: translateX(-50%);
            pointer-events: none;
            white-space: nowrap;
        }
        .correct-answer.show { opacity: 1; }
        .choice-grid.ip-type-choices {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }
        .ip-type-btn {
            min-width: 0;
            min-height: 64px;
            padding: 10px 4px;
            font-size: 1rem;
            word-break: keep-all;
        }
        .nav-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }
        .nav-btn {
            padding: 7px 18px;
            color: var(--accent-cyan);
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-btn:hover { background: rgba(0, 255, 204, 0.1); border-color: var(--accent-cyan); }
        @media (max-width: 560px) {
            .choice-grid.ip-type-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
            .ip-type-btn { min-height: 52px; padding: 8px 4px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <h1>IP Address Type Attack</h1>
    <div id="stats-bar"><span>Quest: <span id="q-count">0</span> / 5</span></div>

    <div class="game-container">
        <div id="start-screen" class="overlay">
            <h2>IP Address Type</h2>
            <p>落ちてくるIPアドレスの種類を選択してください。</p>
            <div class="speed-select">
                <p>落下速度を選択</p>
                <div class="speed-btns">
                    <button class="speed-btn" onclick="setSpeed(0.8, this)">Slow</button>
                    <button class="speed-btn active" onclick="setSpeed(1.5, this)">Normal</button>
                    <button class="speed-btn" onclick="setSpeed(2.5, this)">Fast</button>
                </div>
            </div>
            <button class="start-btn" onclick="start()">START</button>
        </div>

        <div id="result-screen" class="overlay" style="display:none;">
            <h2>FINISH!</h2>
            <div style="font-size: 24px; color: #fff;">正解数: <span id="final-score">0</span> / 5</div>
            <div id="final-time" style="font-size: 48px; color: var(--accent-cyan);">0.00</div>
            <button class="start-btn" onclick="resetGame()">RETRY</button>
        </div>

        <div id="target" class="ip-target">127.0.0.1</div>
        <div id="mark" class="judgment-mark">⭕️</div>
        <div id="correct-answer" class="correct-answer"></div>
    </div>

    <div class="choice-grid ip-type-choices">
        <button class="btn-base choice-btn ip-type-btn" onclick="answer('グローバル')">グローバル</button>
        <button class="btn-base choice-btn ip-type-btn" onclick="answer('プライベート')">プライベート</button>
        <button class="btn-base choice-btn ip-type-btn" onclick="answer('マルチキャスト')">マルチキャスト<br>(プライベート)</button>
        <button class="btn-base choice-btn ip-type-btn" onclick="answer('ループバック')">ループバック<br>(プライベート)</button>
        <button class="btn-base choice-btn ip-type-btn" onclick="answer('リンクローカル')">リンクローカル<br>(プライベート)</button>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="resetGame()">↺ RESET</button>
        <a href="../index.html" class="nav-btn">← Portalに戻る</a>
    </div>

    <script>
        const addressExamples = {
            'グローバル': ['8.8.8.8', '1.1.1.1', '9.9.9.9', '208.67.222.222', '4.2.2.2'],
            'プライベート': ['10.0.0.1', '10.10.10.10', '172.16.0.1', '172.20.10.5', '172.31.255.254', '192.168.0.1', '192.168.1.1', '192.168.10.20'],
            'マルチキャスト': ['224.0.0.1', '224.0.0.5', '224.0.0.251', '239.1.1.1', '239.255.255.250'],
            'ループバック': ['127.0.0.1'],
            'リンクローカル': ['169.254.1.1', '169.254.10.20', '169.254.100.200']
        };
        const addressTypes = Object.keys(addressExamples);
        let correct, correctCount = 0, previousType = null;
        let qCount = 0, startTime, y = -50, anim, transitionTimer;
        let isWait = true, dropSpeed = 1.5;

        function setSpeed(speed, button) {
            dropSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        function start() {
            document.getElementById('start-screen').style.display = 'none';
            startTime = Date.now();
            qCount = 0;
            correctCount = 0;
            previousType = null;
            next();
        }

        function next() {
            if (qCount >= 5) {
                endGame();
                return;
            }
            qCount++;
            document.getElementById('q-count').innerText = qCount;

            const availableTypes = addressTypes.filter(type => type !== previousType);
            correct = availableTypes[Math.floor(Math.random() * availableTypes.length)];
            previousType = correct;
            const examples = addressExamples[correct];
            document.getElementById('target').innerText = examples[Math.floor(Math.random() * examples.length)];
            y = -50;
            isWait = false;
            drop();
        }

        function drop() {
            if (isWait) return;
            y += dropSpeed;
            document.getElementById('target').style.top = y + 'px';
            const targetHeight = document.getElementById('target').offsetHeight;
            const targetCenter = y + targetHeight / 2;
            if (targetCenter > 320 + targetHeight) handle(false);
            else anim = requestAnimationFrame(drop);
        }

        function answer(type) {
            if (!isWait) handle(type === correct);
        }

        function handle(win) {
            isWait = true;
            cancelAnimationFrame(anim);
            if (win) correctCount++;
            const mark = document.getElementById('mark');
            const correctAnswer = document.getElementById('correct-answer');
            mark.innerText = win ? '⭕️' : '❌';
            mark.className = `judgment-mark show-mark ${win ? 'mark-o' : 'mark-x'}`;
            correctAnswer.innerText = win ? '' : `正解: ${correct}`;
            correctAnswer.className = `correct-answer${win ? '' : ' show'}`;
            transitionTimer = setTimeout(() => {
                mark.className = 'judgment-mark';
                correctAnswer.className = 'correct-answer';
                next();
            }, 800);
        }

        function resetGame() {
            cancelAnimationFrame(anim);
            clearTimeout(transitionTimer);
            qCount = 0;
            correctCount = 0;
            previousType = null;
            isWait = true;
            document.getElementById('q-count').innerText = '0';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('target').style.display = 'block';
            document.getElementById('target').style.top = '-50px';
            document.getElementById('mark').className = 'judgment-mark';
            document.getElementById('correct-answer').className = 'correct-answer';
        }

        function endGame() {
            const duration = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('final-score').innerText = correctCount;
            document.getElementById('final-time').innerText = duration;
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('target').style.display = 'none';
        }
    </script>
</body>
</html>
